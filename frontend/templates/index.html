<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterblog - Posts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📚 Masterblog</h1>

        <!-- API URL Input -->
        <div class="input-field">
            <input type="text" id="api-base-url" placeholder="🔗 Enter API Base URL" value="http://127.0.0.1:5002/api">
            <button class="btn btn-primary" onclick="loadPosts()">🔄 Load Posts</button>
        </div>

        <!-- Add Post Form -->
        <div class="form-container">
            <h2>✏️ Add New Post</h2>
            <div class="input-field">
                <input type="text" id="post-title" placeholder="📌 Enter Post Title">
                <input type="text" id="post-content" placeholder="📝 Enter Post Content">
                <button class="btn btn-success" onclick="addPost()">➕ Add Post</button>
            </div>
        </div>

        <!-- Posts Container -->
        <div id="post-container">
            <div class="loading">📡 Loading posts...</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
